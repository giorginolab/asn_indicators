<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ASN Indicators</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="intro">
        <div>
          <p class="eyebrow">Scopus CSV analyzer</p>
          <h1>ASN Indicators</h1>
          <p class="intro-copy">
            Upload the CSV exported from Scopus to compute publication counts,
            citation totals, and h-index windows used by the ASN checks.
          </p>
        </div>
        <a class="secondary-link" href="https://github.com/giorginolab/asn_indicators" target="_blank" rel="noreferrer" aria-label="Open repository on GitHub">
          <svg aria-hidden="true" viewBox="0 0 16 16" width="18" height="18">
            <path fill="currentColor" d="M8 0C3.58 0 0 3.67 0 8.2c0 3.62 2.29 6.69 5.47 7.78.4.08.55-.18.55-.4 0-.2-.01-.85-.01-1.54-2.01.38-2.53-.5-2.69-.96-.09-.24-.48-.96-.82-1.15-.28-.16-.68-.55-.01-.56.63-.01 1.08.59 1.23.83.72 1.24 1.87.89 2.33.68.07-.53.28-.89.51-1.1-1.78-.21-3.64-.91-3.64-4.03 0-.89.31-1.62.82-2.19-.08-.21-.36-1.04.08-2.16 0 0 .67-.22 2.2.84A7.42 7.42 0 0 1 8 3.96c.68 0 1.36.09 2 .28 1.53-1.06 2.2-.84 2.2-.84.44 1.12.16 1.95.08 2.16.51.57.82 1.3.82 2.19 0 3.13-1.87 3.82-3.65 4.03.29.26.54.75.54 1.52 0 1.1-.01 1.98-.01 2.26 0 .22.15.48.55.4A8.07 8.07 0 0 0 16 8.2C16 3.67 12.42 0 8 0Z"/>
          </svg>
          Repository
        </a>
      </section>

      <section class="workspace">
        <form id="controls" class="controls">
          <label id="file-drop" class="file-drop" for="csv-file">
            <span class="file-drop-title">Upload Scopus CSV</span>
            <span class="file-drop-copy">
              In Scopus, use Export CSV, then select or drop that file here.
            </span>
            <input id="csv-file" name="csv-file" type="file" accept=".csv,text/csv">
          </label>

          <div class="settings">
            <label>
              Reference year
              <input id="current-year" name="current-year" type="number" min="1900" max="2200">
            </label>
            <label class="check-row">
              <input id="deduplicate" name="deduplicate" type="checkbox" checked>
              Deduplicate by EID or DOI
            </label>
            <label class="check-row">
              <input id="exclude-errata" name="exclude-errata" type="checkbox" checked>
              Exclude errata
            </label>
          </div>
        </form>

        <section id="status" class="status" aria-live="polite">
          <div id="status-message">Waiting for a Scopus CSV export.</div>
          <div id="removed-records" class="removed-records hidden"></div>
        </section>

        <section id="results" class="results hidden" aria-live="polite">
          <div class="result-header">
            <div>
              <p class="eyebrow">Summary report</p>
              <h2>Computed indicators</h2>
            </div>
            <button id="download-report" type="button">Download report</button>
          </div>

          <div id="summary-grid" class="summary-grid"></div>

          <div class="table-toolbar">
            <h2>Tables</h2>
            <button id="download-tables" type="button">Download tables CSV</button>
          </div>
          <div id="tables" class="tables"></div>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
